# docker compose up --build   ->  API on :8000 (docs at /docs), demo UI on :8501
services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["./configs:/app/configs"]   # edit routing.yaml without rebuilding
  ui:
    build: .
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    environment: ["API_URL=http://api:8000"]
    ports: ["8501:8501"]
    depends_on: [api]
